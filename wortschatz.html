<title>Mein Wortschatz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script>
/* apply the saved theme before first paint */
try { var t = localStorage.getItem('wortschatz.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* Layout: one narrow column like a vocabulary notebook — add-form on top, toolbar, numbered list */
:root {
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #1b2533;
  --muted: #5d6b7c;
  --line: #d6dde5;
  --accent: #2346a8;
  --accent-ink: #ffffff;
  --der: #2a63c9;
  --die: #c4374a;
  --das: #2f8a55;
  --danger: #b3263a;
  --focus: #2346a8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171f; --paper: #1a212c; --ink: #e6ebf2; --muted: #93a1b3; --line: #2c3644;
    --accent: #7d9cf0; --accent-ink: #0f1520; --der: #7aa6f2; --die: #f08494; --das: #6cc791;
    --danger: #f08494; --focus: #9db4f5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171f; --paper: #1a212c; --ink: #e6ebf2; --muted: #93a1b3; --line: #2c3644;
  --accent: #7d9cf0; --accent-ink: #0f1520; --der: #7aa6f2; --die: #f08494; --das: #6cc791;
  --danger: #f08494; --focus: #9db4f5; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 6vw, 38px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 span { color: var(--accent); }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.header-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.theme-seg button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 13px; }
.theme-seg svg { width: 14px; height: 14px; flex: none; }
@media (max-width: 480px) {
  header { align-items: flex-start; }
  .header-side { flex-direction: row-reverse; align-items: center; justify-content: space-between; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  body { transition: background-color .2s, color .2s; }
}

/* Add form */
.add { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.add-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.add-row-2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
@media (max-width: 480px) {
  .add-row-2 { grid-template-columns: 1fr; }
}
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.field-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

input[type="text"], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; width: 100%;
}
input[type="text"]:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
select { width: auto; cursor: pointer; }

.articles { display: flex; gap: 4px; flex-wrap: wrap; }
.art-btn {
  font: 600 14px var(--font-mono); padding: 9px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--muted); min-width: 46px;
}
.art-btn[aria-pressed="true"][data-a="der"] { background: var(--der); border-color: var(--der); color: var(--paper); }
.art-btn[aria-pressed="true"][data-a="die"] { background: var(--die); border-color: var(--die); color: var(--paper); }
.art-btn[aria-pressed="true"][data-a="das"] { background: var(--das); border-color: var(--das); color: var(--paper); }
.art-btn[aria-pressed="true"][data-a=""] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

button { font: inherit; }
button:focus-visible, .art-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn-primary {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  padding: 10px 18px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.hint { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.hint.warn { color: var(--die); }

/* Toolbar */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.dir-btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
.search { flex: 1 1 180px; max-width: 260px; }
.export-btn { border: 1px solid var(--accent); background: var(--paper); color: var(--accent); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
.export-btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.export-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.io { display: flex; gap: 6px; flex-wrap: wrap; }

.import-panel { background: var(--paper); border: 1px solid var(--accent); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.import-panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.import-panel p { margin: 0; color: var(--muted); font-size: 14px; }
.import-panel .stats { color: var(--ink); font-variant-numeric: tabular-nums; }
.import-panel .preview { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.import-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-danger-outline { border: 1px solid var(--danger); background: transparent; color: var(--danger); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.btn-danger-outline:hover { background: var(--danger); color: var(--paper); }
.search input { padding: 8px 12px; background: var(--paper); }

/* List */
ol.list { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: 3ch 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.word-block { min-width: 0; display: flex; flex-direction: column; }
.word { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.art { font-family: var(--font-mono); font-weight: 500; margin-right: 6px; }
.art.der { color: var(--der); } .art.die { color: var(--die); } .art.das { color: var(--das); }
.trans { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.ghost { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.ghost:hover { border-color: var(--line); color: var(--ink); }
.ghost.danger:hover, .ghost.danger-solid { color: var(--danger); border-color: var(--danger); }
.confirm-text { font-size: 13px; color: var(--danger); align-self: center; margin-right: 4px; }

.edit-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.edit-grid .full { grid-column: 1 / -1; }
.edit-grid input, .edit-grid select { padding: 7px 10px; }

.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.footnote { font-size: 12px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 480px) {
  .item { grid-template-columns: 3ch 1fr; }
  .actions { grid-column: 2; justify-content: flex-start; margin-left: -10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .item { transition: background-color .15s; }
  .item.flash { background: color-mix(in srgb, var(--accent) 12%, transparent); }
}
</style>

<div class="wrap">
  <header>
    <h1>Mein <span>Wortschatz</span></h1>
    <div class="header-side">
      <div class="seg theme-seg" role="group" aria-label="Тема оформления">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Светлая тема">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>Светлая
        </button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Тёмная тема">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.8A5.5 5.5 0 0 1 6.2 2.5a5.5 5.5 0 1 0 7.3 7.3Z"/></svg>Тёмная
        </button>
        <button type="button" data-theme-choice="auto" aria-pressed="true" title="Как в системе">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5Z" fill="currentColor"/></svg>Авто
        </button>
      </div>
      <div class="count" id="count"></div>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <div class="field-label">Новое слово</div>
    <div class="add-row">
      <div class="articles" role="group" aria-label="Артикль" id="artGroup">
        <button type="button" class="art-btn" data-a="der" aria-pressed="false">der</button>
        <button type="button" class="art-btn" data-a="die" aria-pressed="false">die</button>
        <button type="button" class="art-btn" data-a="das" aria-pressed="false">das</button>
        <button type="button" class="art-btn" data-a="" aria-pressed="true" title="Без артикля">—</button>
      </div>
      <div>
        <label class="sr" for="wordInput">Слово на немецком</label>
        <input type="text" id="wordInput" placeholder="Wort, z. B. Apfel" lang="de" spellcheck="false" maxlength="80">
      </div>
    </div>
    <div class="add-row-2">
      <div>
        <label class="sr" for="transInput">Перевод (необязательно)</label>
        <input type="text" id="transInput" placeholder="Перевод (необязательно)" maxlength="120">
      </div>
      <button type="submit" class="btn-primary" id="addBtn">Добавить</button>
    </div>
    <p class="hint" id="hint" aria-live="polite">Артикль ставится для существительных. Enter — добавить.</p>
  </form>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Сортировка">
      <button type="button" id="sortTime" aria-pressed="true">По времени</button>
      <button type="button" id="sortAlpha" aria-pressed="false">По алфавиту</button>
    </div>
    <button type="button" class="dir-btn" id="dirBtn"></button>
    <div class="search">
      <label class="sr" for="searchInput">Поиск</label>
      <input type="text" id="searchInput" placeholder="Поиск…">
    </div>
    <div class="io">
      <button type="button" class="export-btn" id="importBtn" title="Загрузить слова из текстового файла">Загрузить .txt</button>
      <button type="button" class="export-btn" id="exportBtn" title="Скачать весь список в текущей сортировке">Скачать .txt</button>
    </div>
    <input type="file" id="importFile" accept=".txt,text/plain" hidden>
  </div>

  <div id="importArea"></div>
  <div id="listArea"></div>
  <p class="footnote" id="storageNote"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const state = {
    words: [], ready: false, mode: null,
    sort: 'time', dir: 'asc', query: '',
    editingId: null, confirmId: null, newArticle: '', flashId: null,
  };
  let coll = null; // db collection when available
  const LS_KEY = 'wortschatz.words.v1';

  // ---------- Storage ----------
  function lsLoad() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
  }
  function lsSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state.words)); } catch (e) {}
  }
  function newId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  async function init() {
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) {}
    let uid = null;
    if (db && user) { try { uid = await user.id(); } catch (e) {} }
    if (db && uid) {
      coll = db.collection('data/users/' + uid);
      state.mode = 'db';
      coll.onSnapshot((snap) => {
        state.words = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        state.ready = true;
        render();
      }, () => {
        fallbackLocal('Связь с хранилищем потеряна. Слова сохраняются в этом браузере.');
      });
    } else {
      fallbackLocal();
    }
  }
  function fallbackLocal(msg) {
    coll = null;
    state.mode = 'local';
    if (!state.words.length) state.words = lsLoad();
    state.ready = true;
    if (msg) toast(msg);
    render();
  }

  async function saveWord(w) {
    if (state.mode === 'db') {
      const body = { de: w.de, article: w.article, ru: w.ru, createdAt: w.createdAt, updatedAt: w.updatedAt || null };
      try { await coll.doc(w.id).set(body); }
      catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Место закончилось: удалите часть слов.' : 'Не удалось сохранить. Попробуйте ещё раз.'); }
    } else {
      const i = state.words.findIndex((x) => x.id === w.id);
      if (i === -1) state.words.push(w); else state.words[i] = w;
      lsSave(); render();
    }
  }
  async function removeWord(id) {
    if (state.mode === 'db') {
      try { await coll.doc(id).delete(); } catch (e) { toast('Не удалось удалить. Попробуйте ещё раз.'); }
    } else {
      state.words = state.words.filter((x) => x.id !== id);
      lsSave(); render();
    }
  }

  // ---------- Helpers ----------
  const collator = new Intl.Collator('de', { sensitivity: 'base' });
  const norm = (s) => s.trim().replace(/\s+/g, ' ');
  function findDuplicate(de, exceptId) {
    const key = de.toLocaleLowerCase('de');
    return state.words.find((w) => w.id !== exceptId && w.de.toLocaleLowerCase('de') === key);
  }
  function fmtDate(ts) {
    try {
      return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  function sorted() {
    const list = state.words.slice();
    if (state.sort === 'alpha') list.sort((a, b) => collator.compare(a.de, b.de) || a.createdAt - b.createdAt);
    else list.sort((a, b) => a.createdAt - b.createdAt);
    if (state.dir === 'desc') list.reverse();
    return list;
  }
  function plural(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'слово';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'слова';
    return 'слов';
  }
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- Render ----------
  function render() {
    const active = document.activeElement && document.activeElement.id;
    const selStart = document.activeElement && document.activeElement.selectionStart;
    renderInner();
    if (active && (active === 'editDe' || active === 'editRu' || active === 'editArt')) {
      const e = $(active);
      if (e) { e.focus(); if (selStart != null && e.setSelectionRange) e.setSelectionRange(selStart, selStart); }
    }
  }
  function renderInner() {
    const n = state.words.length;
    $('count').textContent = state.ready ? n + ' ' + plural(n) : '';
    $('sortTime').setAttribute('aria-pressed', String(state.sort === 'time'));
    $('sortAlpha').setAttribute('aria-pressed', String(state.sort === 'alpha'));
    $('exportBtn').disabled = !state.ready || !n;
    $('importBtn').disabled = !state.ready;
    renderImport();
    $('dirBtn').textContent = state.sort === 'alpha'
      ? (state.dir === 'asc' ? 'A → Z' : 'Z → A')
      : (state.dir === 'asc' ? 'Сначала старые' : 'Сначала новые');
    $('storageNote').textContent = state.mode === 'db'
      ? 'Список сохраняется в вашем аккаунте и виден только вам.'
      : state.mode === 'local' ? 'Список сохраняется в этом браузере.' : '';

    const area = $('listArea');
    area.replaceChildren();

    if (!state.ready) {
      const e = el('div', 'empty'); e.append(el('strong', null, 'Загружаем список…')); area.append(e); return;
    }
    if (!n) {
      const e = el('div', 'empty');
      e.append(el('strong', null, 'Список пока пуст'));
      e.append(document.createTextNode('Введите первое слово в поле выше — оно появится здесь под номером 1.'));
      area.append(e); return;
    }

    // numbering follows the current sort; search filters but keeps the numbers
    const all = sorted();
    const q = state.query.toLocaleLowerCase('ru');
    const ol = el('ol', 'list');
    let shown = 0;
    all.forEach((w, idx) => {
      if (q && !(w.de.toLocaleLowerCase('de').includes(q) || (w.ru || '').toLocaleLowerCase('ru').includes(q))) return;
      shown++;
      ol.append(state.editingId === w.id ? editRow(w, idx + 1) : viewRow(w, idx + 1));
    });
    if (!shown) {
      const e = el('div', 'empty'); e.append(el('strong', null, 'Ничего не найдено'));
      e.append(document.createTextNode('По запросу «' + state.query + '» слов нет.'));
      area.append(e); return;
    }
    area.append(ol);
  }

  function viewRow(w, num) {
    const li = el('li', 'item' + (state.flashId === w.id ? ' flash' : ''));
    li.append(el('span', 'num', num + '.'));
    const b = el('div', 'word-block');
    const wd = el('div', 'word');
    if (w.article) wd.append(el('span', 'art ' + w.article, w.article));
    wd.append(document.createTextNode(w.de));
    wd.lang = 'de';
    b.append(wd);
    if (w.ru) b.append(el('div', 'trans', w.ru));
    b.append(el('div', 'meta', 'добавлено ' + fmtDate(w.createdAt) + (w.updatedAt ? ' · изменено' : '')));
    li.append(b);

    const act = el('div', 'actions');
    if (state.confirmId === w.id) {
      act.append(el('span', 'confirm-text', 'Удалить?'));
      const yes = el('button', 'ghost danger-solid', 'Да');
      yes.type = 'button';
      yes.onclick = () => { state.confirmId = null; removeWord(w.id); toast('Слово «' + w.de + '» удалено'); };
      const no = el('button', 'ghost', 'Нет'); no.type = 'button';
      no.onclick = () => { state.confirmId = null; render(); };
      act.append(yes, no);
    } else {
      const ed = el('button', 'ghost', 'Изменить'); ed.type = 'button';
      ed.onclick = () => { state.editingId = w.id; state.draft = null; state.confirmId = null; render(); focusEdit(); };
      const del = el('button', 'ghost danger', 'Удалить'); del.type = 'button';
      del.onclick = () => { state.confirmId = w.id; state.editingId = null; render(); };
      act.append(ed, del);
    }
    li.append(act);
    return li;
  }

  function editRow(w, num) {
    const li = el('li', 'item');
    li.append(el('span', 'num', num + '.'));
    const g = el('div', 'edit-grid');
    // keep what was typed if the list re-renders while editing
    if (!state.draft || state.draft.id !== w.id) state.draft = { id: w.id, de: w.de, ru: w.ru || '', article: w.article || '' };
    const d = state.draft;
    const sel = document.createElement('select');
    sel.id = 'editArt';
    sel.setAttribute('aria-label', 'Артикль');
    [['', '—'], ['der', 'der'], ['die', 'die'], ['das', 'das']].forEach(([v, t]) => {
      const o = el('option', null, t); o.value = v; if (d.article === v) o.selected = true; sel.append(o);
    });
    const de = document.createElement('input'); de.type = 'text'; de.id = 'editDe'; de.value = d.de; de.maxLength = 80; de.lang = 'de';
    de.setAttribute('aria-label', 'Слово');
    const ru = document.createElement('input'); ru.type = 'text'; ru.id = 'editRu'; ru.value = d.ru; ru.maxLength = 120;
    ru.placeholder = 'Перевод'; ru.className = 'full'; ru.setAttribute('aria-label', 'Перевод');
    de.addEventListener('input', () => { d.de = de.value; });
    ru.addEventListener('input', () => { d.ru = ru.value; });
    sel.addEventListener('change', () => { d.article = sel.value; });
    g.append(sel, de, ru);
    li.append(g);

    const save = () => {
      const v = norm(de.value);
      if (!v) { toast('Слово не может быть пустым'); de.focus(); return; }
      const dup = findDuplicate(v, w.id);
      if (dup) { toast('Такое слово уже есть в списке'); de.focus(); return; }
      const upd = Object.assign({}, w, { de: v, article: sel.value, ru: norm(ru.value), updatedAt: Date.now() });
      state.editingId = null; state.draft = null; state.flashId = w.id;
      saveWord(upd); render(); toast('Сохранено');
      setTimeout(() => { state.flashId = null; render(); }, 1200);
    };
    const cancel = () => { state.editingId = null; state.draft = null; render(); };
    [de, ru, sel].forEach((x) => x.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    }));

    const act = el('div', 'actions');
    const s = el('button', 'btn-primary', 'Сохранить'); s.type = 'button'; s.onclick = save;
    const c = el('button', 'ghost', 'Отмена'); c.type = 'button'; c.onclick = cancel;
    act.append(s, c);
    li.append(act);
    return li;
  }
  function focusEdit() { const e = $('editDe'); if (e) { e.focus(); e.select(); } }

  // ---------- Add form ----------
  $('artGroup').addEventListener('click', (e) => {
    const b = e.target.closest('.art-btn'); if (!b) return;
    state.newArticle = b.dataset.a;
    $('artGroup').querySelectorAll('.art-btn').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('wordInput').addEventListener('input', () => {
    const v = norm($('wordInput').value);
    const dup = v && findDuplicate(v);
    const h = $('hint');
    if (dup) { h.textContent = 'Это слово уже есть в списке.'; h.classList.add('warn'); }
    else { h.textContent = 'Артикль ставится для существительных. Enter — добавить.'; h.classList.remove('warn'); }
  });
  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!state.ready) return;
    const de = norm($('wordInput').value);
    if (!de) { toast('Введите слово'); $('wordInput').focus(); return; }
    if (findDuplicate(de)) { toast('Такое слово уже есть в списке'); return; }
    const w = { id: newId(), de, article: state.newArticle, ru: norm($('transInput').value), createdAt: Date.now(), updatedAt: null };
    state.flashId = w.id;
    if (state.mode === 'db') { state.words = state.words.concat([w]); }
    saveWord(w); render();
    setTimeout(() => { state.flashId = null; render(); }, 1200);
    $('wordInput').value = ''; $('transInput').value = '';
    $('wordInput').dispatchEvent(new Event('input'));
    $('wordInput').focus();
  });

  // ---------- Toolbar ----------
  $('sortTime').onclick = () => { state.sort = 'time'; render(); };
  $('sortAlpha').onclick = () => { state.sort = 'alpha'; render(); };
  $('dirBtn').onclick = () => { state.dir = state.dir === 'asc' ? 'desc' : 'asc'; render(); };
  $('searchInput').addEventListener('input', (e) => { state.query = e.target.value.trim(); render(); });

  // ---------- Export to .txt ----------
  function buildTxt() {
    const list = sorted();
    const n = list.length;
    const sortLabel = state.sort === 'alpha'
      ? 'по алфавиту (' + (state.dir === 'asc' ? 'A → Z' : 'Z → A') + ')'
      : 'по времени добавления (' + (state.dir === 'asc' ? 'сначала старые' : 'сначала новые') + ')';
    const lines = [
      'Mein Wortschatz — ' + n + ' ' + plural(n),
      'Сортировка: ' + sortLabel,
      'Дата: ' + new Date().toLocaleDateString('ru-RU'),
      '',
    ];
    const width = String(n).length;
    list.forEach((w, i) => {
      const num = String(i + 1).padStart(width, ' ') + '. ';
      const word = (w.article ? w.article + ' ' : '') + w.de;
      lines.push(num + word + (w.ru ? ' — ' + w.ru : ''));
    });
    return lines.join('\r\n') + '\r\n';
  }
  // ---------- Import from .txt ----------
  // Accepts the app's own export and simple hand-written lists:
  //   "1. der Apfel — яблоко", "Apfel - яблоко", "laufen<TAB>бегать", "das Buch"
  function parseTxt(text) {
    const items = [];
    const seen = new Set();
    let skipped = 0;
    text.replace(/^﻿/, '').split(/\r?\n/).forEach((raw) => {
      let line = raw.trim();
      if (!line) return;
      if (/^(Mein Wortschatz\b|Сортировка:|Дата:)/i.test(line)) return;
      line = line.replace(/^\d+\s*[.)]\s*/, '');           // leading numbering
      let de = line, ru = '';
      const m = line.match(/\t|\s+[—–-]\s+|\s+=\s+/);      // separator with spaces, so E-Mail stays whole
      if (m) { de = line.slice(0, m.index); ru = line.slice(m.index + m[0].length); }
      de = norm(de); ru = norm(ru);
      let article = '';
      const a = de.match(/^(der|die|das)\s+(.+)$/i);
      if (a) { article = a[1].toLowerCase(); de = a[2]; }
      if (!de || de.length > 80) { skipped++; return; }
      const key = de.toLocaleLowerCase('de');
      if (seen.has(key)) return;
      seen.add(key);
      items.push({ de, article, ru: ru.slice(0, 120) });
    });
    return { items, skipped };
  }

  $('importBtn').onclick = () => { $('importFile').value = ''; $('importFile').click(); };
  $('importFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    let text = '';
    try { text = await file.text(); } catch (err) { toast('Не удалось прочитать файл'); return; }
    const { items, skipped } = parseTxt(text);
    if (!items.length) { toast('В файле не нашлось слов. Нужна одна строка на слово.'); return; }
    const fresh = items.filter((it) => !findDuplicate(it.de));
    state.importPreview = { name: file.name, items, fresh, dups: items.length - fresh.length, skipped };
    render();
    $('importArea').scrollIntoView({ block: 'nearest' });
  });

  function renderImport() {
    const area = $('importArea');
    area.replaceChildren();
    const ip = state.importPreview;
    if (!ip) return;
    const box = el('div', 'import-panel');
    box.setAttribute('role', 'region');
    box.setAttribute('aria-label', 'Загрузка списка');
    box.append(el('h2', null, 'Файл «' + ip.name + '»'));
    let stats = 'Найдено ' + ip.items.length + ' ' + plural(ip.items.length) + ': новых ' + ip.fresh.length + ', уже в списке ' + ip.dups + '.';
    if (ip.skipped) stats += ' Пропущено строк: ' + ip.skipped + ' (слишком длинные).';
    box.append(el('p', 'stats', stats));
    const sample = ip.items.slice(0, 5).map((it) => (it.article ? it.article + ' ' : '') + it.de + (it.ru ? ' — ' + it.ru : '')).join(' · ');
    box.append(el('p', 'preview', 'Например: ' + sample + (ip.items.length > 5 ? ' …' : '')));

    const act = el('div', 'import-actions');
    const addBtn = el('button', 'btn-primary', ip.fresh.length ? 'Добавить новые (' + ip.fresh.length + ')' : 'Новых слов нет');
    addBtn.type = 'button'; addBtn.disabled = !ip.fresh.length;
    addBtn.onclick = () => applyImport(false);
    act.append(addBtn);
    if (state.words.length) {
      const rep = el('button', 'btn-danger-outline', 'Заменить весь список');
      rep.type = 'button';
      rep.title = 'Текущие ' + state.words.length + ' ' + plural(state.words.length) + ' будут удалены';
      rep.onclick = () => applyImport(true);
      act.append(rep);
    }
    const cancel = el('button', 'ghost', 'Отмена'); cancel.type = 'button';
    cancel.onclick = () => { state.importPreview = null; render(); };
    act.append(cancel);
    box.append(act);
    if (state.words.length) box.append(el('p', null, 'При замене текущий список удалится. Сначала можно скачать его через «Скачать .txt».'));
    area.append(box);
  }

  async function applyImport(replace) {
    const ip = state.importPreview;
    if (!ip) return;
    const src = replace ? ip.items : ip.fresh;
    const base = Date.now();
    // createdAt keeps the file's line order when sorting by time
    const words = src.map((it, i) => ({ id: newId(), de: it.de, article: it.article, ru: it.ru, createdAt: base + i, updatedAt: null }));
    state.importPreview = null;
    if (state.mode === 'db') {
      if (replace) for (const w of state.words.slice()) { try { await coll.doc(w.id).delete(); } catch (e) {} }
      for (const w of words) await saveWord(w);
    } else {
      state.words = replace ? words : state.words.concat(words);
      lsSave();
    }
    state.editingId = null; state.confirmId = null;
    render();
    toast((replace ? 'Список заменён: ' : 'Добавлено ') + words.length + ' ' + plural(words.length));
  }

  $('exportBtn').onclick = () => {
    if (!state.words.length) return;
    const d = new Date();
    const pad = (x) => String(x).padStart(2, '0');
    const name = 'wortschatz-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.txt';
    // BOM so Windows Notepad opens umlauts and Cyrillic correctly
    const blob = new Blob(['\uFEFF' + buildTxt()], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Список сохранён: ' + name);
  };

  // ---------- Theme ----------
  const THEME_KEY = 'wortschatz.theme';
  function currentTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    return t === 'light' || t === 'dark' ? t : 'auto';
  }
  function applyTheme(choice) {
    if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
    else document.documentElement.removeAttribute('data-theme');
    try {
      if (choice === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, choice);
    } catch (e) {}
    syncThemeButtons();
  }
  function syncThemeButtons() {
    const cur = currentTheme();
    document.querySelectorAll('[data-theme-choice]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === cur)));
  }
  document.querySelectorAll('[data-theme-choice]').forEach((b) => { b.onclick = () => applyTheme(b.dataset.themeChoice); });
  syncThemeButtons();

  render();
  init();
})();
</script>
